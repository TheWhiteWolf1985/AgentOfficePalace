name: Release

# Main mirrors development. Only a tested commit promoted to release can publish.

on:
  push:
    branches: [main, release]
    tags: ['v*-rc.*']
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'deploy/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run typecheck

      - run: npm test

      - name: Pack the release
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          npm version "$version" --no-git-tag-version --allow-same-version
          # It's built already, and installs don't have the build tools.
          npm pkg delete scripts.prepare
          # Installs get exactly the dependency versions tested here.
          cp package-lock.json npm-shrinkwrap.json
          npm pkg set 'files[]=npm-shrinkwrap.json'
          npm pack --ignore-scripts
          mv "agent-office-$version.tgz" agent-office.tgz
          tar -tzf agent-office.tgz | grep -qx 'package/npm-shrinkwrap.json'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the compiled package starts
        run: |
          install_dir="$RUNNER_TEMP/package-smoke"
          mkdir -p "$install_dir"
          tar -xzf agent-office.tgz -C "$install_dir"
          cd "$install_dir/package"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          AGENT_OFFICE_CONNECTIONS_DIR="$RUNNER_TEMP/smoke-connections" node bin/agent-office.js --home "$RUNNER_TEMP/smoke-office" --host 127.0.0.1 --port 4700 --password ci --no-open > "$RUNNER_TEMP/office.log" 2>&1 &
          office=$!
          trap 'kill -INT "$office" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/api/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/office.log"
          [ "$code" = 200 ] || { echo "the packed application did not start"; exit 1; }
          curl --fail --silent http://127.0.0.1:4700/login.html > /dev/null

      - name: Build the Debian distribution
        env:
          PREVIEW_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir delivery
          mv agent-office.tgz delivery/
          bash deploy/debian/pack-release.sh delivery "${{ steps.pack.outputs.version }}" "$GITHUB_SHA"
          python3 deploy/debian/test-release.py
          python3 deploy/proxmox/test-provision.py
          bash -n delivery/proxmox.sh

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_type == 'tag' || github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
        with:
          name: debian-release
          path: delivery/
          compression-level: 0
          retention-days: 3

  publish:
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag' || github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: debian-release
          path: delivery
      - name: Publish qualified assets together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$(jq -er .version delivery/release.json)
          test "$(jq -er .commit delivery/release.json)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$TAG"-rc.* ]]
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes"
            gh release create "$GITHUB_REF_NAME" delivery/* --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes"
            exit 0
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            gh release download "$TAG" -p release.json -D "$RUNNER_TEMP"
            cmp delivery/release.json "$RUNNER_TEMP/release.json" || {
              # Rebuilds can produce different archives. Never replace a published version.
              test "$(jq -er .commit "$RUNNER_TEMP/release.json")" = "$GITHUB_SHA"
            }
            exit 0
          fi
          gh release create "$TAG" delivery/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
