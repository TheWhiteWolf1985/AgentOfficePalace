name: Release

# Main publishes the compiled application package after build, tests and a startup smoke check.
# PRs execute the same checks without publishing. Version = major.minor.commit-count.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'deploy/debian/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - 'deploy/debian/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run typecheck

      - run: npm test

      - name: Pack the release
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          npm version "$version" --no-git-tag-version --allow-same-version
          # It's built already, and installs don't have the build tools.
          npm pkg delete scripts.prepare
          # Installs get exactly the dependency versions tested here.
          cp package-lock.json npm-shrinkwrap.json
          npm pkg set 'files[]=npm-shrinkwrap.json'
          npm pack --ignore-scripts
          mv "agent-office-$version.tgz" agent-office.tgz
          tar -tzf agent-office.tgz | grep -qx 'package/npm-shrinkwrap.json'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the compiled package starts
        run: |
          install_dir="$RUNNER_TEMP/package-smoke"
          mkdir -p "$install_dir"
          tar -xzf agent-office.tgz -C "$install_dir"
          cd "$install_dir/package"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          AGENT_OFFICE_CONNECTIONS_DIR="$RUNNER_TEMP/smoke-connections" node bin/agent-office.js --home "$RUNNER_TEMP/smoke-office" --host 127.0.0.1 --port 4700 --password ci --no-open > "$RUNNER_TEMP/office.log" 2>&1 &
          office=$!
          trap 'kill -INT "$office" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/api/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/office.log"
          [ "$code" = 200 ] || { echo "the packed application did not start"; exit 1; }
          curl --fail --silent http://127.0.0.1:4700/login.html > /dev/null

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pack.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" agent-office.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
