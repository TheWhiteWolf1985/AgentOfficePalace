services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless
    container_name: forgejo
    user: "1000:1000"
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "192.168.1.76:3000:3000"
      - "192.168.1.76:2222:2222"
    volumes:
      - /srv/data/forgejo/data:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro
